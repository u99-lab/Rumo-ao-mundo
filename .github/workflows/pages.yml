name: Publicar Atlas de Portugal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter os ficheiros do Atlas
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar o site
        id: deploy
        uses: actions/deploy-pages@v4
